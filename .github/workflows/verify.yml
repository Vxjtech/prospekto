name: Verify Prospekto
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_PATH: /tmp/prospekto-build.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Install isolated browser test runtime
        run: npm install --prefix /tmp/prospekto-browser --no-audit --no-fund playwright@1.55.1
      - run: /tmp/prospekto-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser registration and onboarding checks
        run: node scripts/test-account-ui.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/prospekto-browser/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-ui-screenshots
          path: test-results/
          if-no-files-found: ignore
